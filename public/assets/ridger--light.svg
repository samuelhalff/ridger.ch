<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 32" width="100" height="32" role="img" aria-label="Ridger">
  <!-- Bronze accent rule before wordmark -->
  <rect x="0" y="14" width="3" height="4" fill="#9a7b4f"/>
  <!-- RIDGER wordmark: light variant (paper text for dark backgrounds) -->
  <text
    x="8"
    y="23"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14"
    font-weight="400"
    letter-spacing="3.5"
    fill="#faf7f2"
    text-rendering="geometricPrecision"
  >RIDGER</text>
</svg>
