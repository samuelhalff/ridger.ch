name: Validate SEO & sitemap

on:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'scripts/validate-seo.js'
      - 'public/robots.txt'
      - 'next.config.js'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Validate SEO (blocking)
        run: node scripts/validate-seo.js
