name: Lighthouse CI (production)

# Runs against the live site after each successful deploy. SEO checks and
# the LCP/CLS budgets are errors (the run turns red); performance, accessibility
# and best-practice scores are warnings. Budgets: lighthouserc.mobile.json.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Deploy (SSH)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  lhci:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"

      - name: Lighthouse (mobile, with assertions)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json

      - name: Upload LHCI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lhci-results
          path: .lighthouseci
          retention-days: 7
          if-no-files-found: ignore
